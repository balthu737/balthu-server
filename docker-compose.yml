services:
  frontend:
    build: ./my-app
    restart: unless-stopped
    ports:
      - "3000:80"

  backend:
    build: ./app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    volumes:
      - /proc:/host/proc:ro
      - /:/host/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: unless-stopped