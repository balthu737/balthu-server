services:
  frontend:
    build: ./my-app
    restart: unless-stopped
    ports:
      - "3000:80"

  backend:
    build: ./app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: unless-stopped